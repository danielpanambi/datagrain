name: Update service texts

on:
  push:
    paths:
      - '.github/workflows/update-service-texts.yml'

permissions:
  contents: write

jobs:
  update-service-texts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace service card texts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''                <p class="u-align-center u-text u-text-default-lg u-text-default-xl u-text-2"><span style="text-decoration: underline !important;">Consultoria</span>\n                  <br><span style="font-weight: 400;">Estratégia Empresarial<br>Tecnologias Digitais<br>Portfólio de Produtos<br>Processos</span>\n                </p>''',
                  '''                <p class="u-align-center u-text u-text-default-lg u-text-default-xl u-text-2"><span style="text-decoration: underline !important;">Diagnóstico e Estratégia Digital</span>\n                  <br><span style="font-weight: 400;">Compreensão de desafios e<br>oportunidades para definição de<br>estratégias, tecnologias e caminhos<br>de transformação.</span>\n                </p>'''
              ),
              (
                  '''                <p class="u-align-center u-text u-text-default-lg u-text-default-xl u-text-3">Secagem Digital<br><span class="u-text-palette-2-base">(Sob Consulta)</span>\n                  <br><span style="font-weight: 400;">Plataforma Tecnológica SAAS<br>para maximização da eficiência<br>na secagem de grãos</span>\n                </p>''',
                  '''                <p class="u-align-center u-text u-text-default-lg u-text-default-xl u-text-3">Projetos e Novos Negócios\n                  <br><span style="font-weight: 400;">Estruturação de projetos, produtos,<br>serviços e modelos de negócio técnica<br>e comercialmente viáveis.</span>\n                </p>'''
              ),
              (
                  '''                <p class="u-align-center u-text u-text-default-lg u-text-default-xl u-text-4">Análise de Dados<br><span style="font-weight: 400;">Através de modelos matemáticos<br>oferece insights estratégicos<br>para o seu negócio</span>\n                </p>''',
                  '''                <p class="u-align-center u-text u-text-default-lg u-text-default-xl u-text-4">Dados e Inteligência Aplicada<br><span style="font-weight: 400;">Aplicação de dados, engenharia e<br>modelos analíticos para apoiar<br>decisões e melhorar resultados.</span>\n                </p>'''
              ),
              (
                  '''                <p class="u-align-center u-text u-text-default-lg u-text-default-xl u-text-5">Treinamento<br><span style="font-weight: 400;">A tecnologia como propulsora<br>da eficiência nos processos</span>\n                </p>''',
                  '''                <p class="u-align-center u-text u-text-default-lg u-text-default-xl u-text-5">Conexão e Integração<br><span style="font-weight: 400;">Conexão entre organizações,<br>tecnologias, especialistas e parceiros<br>para viabilizar soluções.</span>\n                </p>'''
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Texto esperado não encontrado em index.html')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update service card texts"
          git push

# trigger
