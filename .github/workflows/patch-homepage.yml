name: Patch homepage copy

on:
  push:
    paths:
      - '.github/workflows/patch-homepage.yml'

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update homepage text
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_first = '''          <br><br>A <span style="font-weight: 700;">DATAGRAIN </span>nasce para maximizar a eficiência operacional, com foco inicial para o agronegócio nos processos pós-colheita de grãos. Aplicamos tecnologias digitais, inteligência artificial, análise de dados e modelos matemáticos para otimizar processos críticos e aprimorar a tomada de decisão.'''
          new_first = '''          <br><br>A Datagrain é uma empresa de <span style="font-weight: 700;">consultoria e integração estratégica em inovação e transformação digital</span>, que conecta desafios das organizações a conhecimento, tecnologias, empresas e parceiros capazes de transformá-los em soluções e resultados. Sua atuação combina experiência de mercado, engenharia e tecnologias digitais para compreender problemas, identificar oportunidades e estruturar projetos alinhados às necessidades de cada negócio.'''

          old_second = '''        <p class="u-align-justify u-text u-text-custom-color-2 u-text-2"> Comprometida com a inovação e a sustentabilidade, a DATAGRAIN expande sua atuação para oferecer soluções escaláveis a outros segmentos e cadeias produtivas, onde eficiência e inteligência de dados são essenciais para reduzir perdas, melhorar a qualidade e aumentar a produtividade.</p>'''
          new_second = '''        <p class="u-align-justify u-text u-text-custom-color-2 u-text-2"> Atuando na interface entre <span style="font-weight: 700;">necessidades de negócio e capacidades tecnológicas</span>, a Datagrain integra academia e mercado para transformar desafios operacionais e estratégicos em projetos viáveis. Com forte experiência no agronegócio e no pós-colheita de grãos, amplia sua atuação para diferentes cadeias produtivas que buscam utilizar <span style="font-weight: 700;">tecnologia, dados, automação e inovação para aumentar a eficiência, fortalecer a competitividade e desenvolver novos negócios</span>.</p>'''

          if old_first not in text:
              raise SystemExit('Primeiro texto esperado não foi encontrado em index.html')
          if old_second not in text:
              raise SystemExit('Segundo texto esperado não foi encontrado em index.html')

          text = text.replace(old_first, new_first, 1)
          text = text.replace(old_second, new_second, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Datagrain homepage description"
            git push
          fi

# retrigger
